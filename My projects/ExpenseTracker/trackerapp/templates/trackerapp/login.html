
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ExpenseFlow</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f6fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,.06);
        }

        .logo {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            color: #7048e8;
            margin-bottom: 25px;
        }

        h2 {
            text-align: center;
            color: #20243a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9294a7;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 18px 0 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #e4e5ee;
            border-radius: 9px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: #7048e8;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #7048e8;
            color: white;
            border: none;
            border-radius: 9px;
            margin-top: 25px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #5732c5;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #85879b;
            font-size: 14px;
        }

        a {
            color: #7048e8;
            text-decoration: none;
            font-weight: 600;
        }

        .errorlist {
            color: #ed5368;
            font-size: 13px;
            margin-top: 8px;
            padding-left: 18px;
        }

        .messages {
            color: #ed5368;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">✦ ExpenseFlow</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to manage your finances.
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                {{ message }}
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        {% for field in form %}

            <label>{{ field.label }}</label>

            {{ field }}

            {{ field.errors }}

        {% endfor %}

        <button type="submit">
            Login
        </button>

    </form>

    <div class="footer">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </div>

</div>

</body>
</html>
